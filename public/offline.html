<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17211d">
  <title>FlowLedger · 离线</title>
  <style>html{background:#f4f1e9;color:#17211d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(420px,100%);box-sizing:border-box;border:1px solid rgba(23,33,29,.1);border-radius:28px;background:#fffdf8;padding:30px;box-shadow:0 18px 55px rgba(42,47,35,.08)}.icon{width:72px;height:72px;border-radius:20px;background:#17211d;color:#d8ff5f;display:grid;place-items:center;font-size:24px;font-weight:850;letter-spacing:-2px}.icon i{font-style:normal;color:#fff}.icon b{color:#d8ff5f}h1{font-size:27px;letter-spacing:-1px;margin:24px 0 8px}p{color:#727971;font-size:14px;line-height:1.7;margin:0 0 22px}button{border:0;border-radius:14px;background:#d8ff5f;color:#17211d;padding:12px 16px;font:inherit;font-weight:750}small{display:block;color:#8a908a;margin-top:16px;line-height:1.5}</style>
</head>
<body><main class="card"><div class="icon"><span><i>F</i><b>L.</b></span></div><h1>当前没有网络</h1><p>FlowLedger 会保留已加载的界面。重新联网后即可继续同步账本和刷新行情。</p><button onclick="location.reload()">重新连接</button><small>为保护账本数据，离线状态下不会提交新增或修改操作。</small></main></body>
</html>
